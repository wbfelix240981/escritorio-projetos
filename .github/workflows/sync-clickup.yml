name: Sync ClickUp → Painel

on:
  schedule:
    # A cada 30 minutos, das 06:00 às 22:00 (horário de Brasília, UTC-3).
    # O GitHub Actions usa UTC: 06:00 BRT = 09:00 UTC ... 22:00 BRT = 01:00 UTC.
    - cron: '*/30 9-23 * * *'   # 06:00–20:30 BRT
    - cron: '*/30 0 * * *'      # 21:00 e 21:30 BRT
    - cron: '0 1 * * *'         # 22:00 BRT
  workflow_dispatch:
    # Permite rodar manualmente pela aba Actions do GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sincronizar % dos projetos com o ClickUp
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: python3 scripts/sync_clickup.py --file index.html

      - name: Commit e push se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "Nada para commitar" || git commit -m "sync: atualização automática ClickUp $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
